<article class="post-card masonry-item">
  <a class="post-card-image" href="{{ include.post.url | relative_url }}">
    {% if include.post.featured_image %}
      <img
        src="{{ include.post.featured_image | relative_url }}"
        alt="{{ include.post.featured_image_alt | default: include.post.title | escape }}"
        loading="lazy"
      >
    {% endif %}
  </a>
  <div class="post-card-body">
    <h2><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h2>
  </div>
  <footer class="post-card-meta">
    {% if include.post.categories.first %}
      <span class="category-chip">{{ include.post.categories.first }}</span>
    {% endif %}
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %e" }}</time>
    <span class="likes" aria-label="좋아요 {{ include.post.likes | default: 0 }}">♥ {{ include.post.likes | default: 0 }}</span>
  </footer>
</article>
