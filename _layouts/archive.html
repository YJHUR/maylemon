---
layout: default
body_class: archive-page
---

<div class="archive-shell">
  <header>
    <p>{{ page.taxonomy_type | default: "archive" }}</p>
    <h1>{{ page.title }}</h1>
  </header>
  <section class="masonry-grid">
    {% assign archive_posts = page.posts | default: site.posts %}
    {% for post in archive_posts %}
      {% include post-card.html post=post %}
    {% endfor %}
  </section>
</div>
